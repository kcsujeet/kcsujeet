<svg xmlns="http://www.w3.org/2000/svg" width="212" height="192" viewBox="0 0 212 192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Debackground: Background removal that never leaves your browser.</title>
  
  <line x1="0" y1="88" x2="93" y2="88" stroke="#d29922" stroke-width="10" stroke-linecap="butt"/>
  <line x1="119" y1="88" x2="194" y2="88" stroke="#d29922" stroke-width="10" stroke-linecap="round"/>
  <circle cx="106" cy="88" r="10" fill="none" stroke="#1f2328" stroke-width="6"/>
  <svg x="38" y="126" width="18" height="18" viewBox="0 0 32 32">
  <defs>
    <mask id="gap-mask">
      <rect x="0" y="0" width="32" height="32" fill="white"/>
      <rect x="12" y="2" width="18" height="18" rx="4" fill="black" stroke="black" stroke-width="4"/>
    </mask>
  </defs>

  
  <rect x="2" y="12" width="18" height="18" rx="4" stroke="#94a3b8" stroke-width="2.5" mask="url(#gap-mask)"/>

  
  <rect x="12" y="2" width="18" height="18" rx="4" fill="#477ed8"/>
</svg>
  <text x="62" y="140" font-size="16" font-weight="600" fill="#1f2328">Debackground</text>
  <text x="106" y="162" font-size="12" text-anchor="middle" fill="#59636e">Background removal that</text>
